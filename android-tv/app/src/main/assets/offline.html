<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoboDad</title>
<style>
:root{--bg:#E8EFF5;--ink:#1B2A3A;--muted:#5A6B7E;--btn:#F2B533;--btn-ink:#2A1E00}
@media (prefers-color-scheme: dark){:root{--bg:#101821;--ink:#E5EDF5;--muted:#9AAABB}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
h1{font-size:1.5rem;margin:0 0 8px} p{color:var(--muted);margin:0 0 20px;max-width:30ch}
a{display:inline-block;background:var(--btn);color:var(--btn-ink);font-weight:800;text-decoration:none;padding:12px 26px;border-radius:999px}
</style></head>
<body><main>
<h1>RoboDad can't connect</h1>
<p>Check your Wi-Fi or mobile data, then try again.</p>
<a href="https://robodad.app/?source=android">Try again</a>
</main></body></html>
