name: Security checks
on:
  push: { branches: [main] }
  schedule: [{ cron: "17 9 * * 1" }]   # Mondays
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Known vulnerabilities in dependencies
        run: pip install pip-audit && pip-audit -r requirements.txt
      - name: Crisis safety rules
        run: pip install -r requirements.txt && python scripts/test_safety.py
      - name: Chess rules and server tests
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y stockfish
          node scripts/test_chess_rules.js
          STOCKFISH_PATH=/usr/games/stockfish python scripts/test_chess_api.py
          python scripts/test_chess_daily.py
      # The gitleaks CLI is MIT-licensed and free for organisation repos. The
      # gitleaks-action wrapper is not: since v2 it needs a paid licence key for
      # org-owned repos, which is why this job failed after the move to the
      # robodadapp org. Same scan, run straight from the pinned release.
      - name: No secrets committed (whole history)
        env:
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          set -euo pipefail
          TAR="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$TAR" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TAR}"
          echo "${GITLEAKS_SHA256}  ${TAR}" | sha256sum -c -
          tar xzf "$TAR" gitleaks
          ./gitleaks git . --redact --exit-code 1
