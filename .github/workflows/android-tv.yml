# Builds RoboDad TV (android-tv/): the home-screen app for Siddhant's Sony
# Android TV. It is installed on the TV by hand with adb, not through Google Play.
#
# Each run builds robodad-tv.apk, opens it on a virtual Android TV, makes it the
# home screen there the same way as on the real TV, and saves the APK plus
# screenshots to the "android-tv-build" branch.
name: Android TV app
on:
  push:
    branches: [main, tv-launcher]
    paths: ["android-tv/**", ".github/workflows/android-tv.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle -p android-tv --no-daemon assembleRelease
          mkdir -p out
          cp android-tv/app/build/outputs/apk/release/app-release.apk out/robodad-tv.apk
          echo "$ANDROID_VERSION_CODE" > out/version-code.txt

      - name: Allow the virtual TV to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Try it on a virtual Android TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          script: bash android-tv/ci-tv-test.sh

      - name: Save the results to the android-tv-build branch
        if: always()
        run: |
          mkdir -p out && cd out
          echo "Built from ${GITHUB_SHA} on $(date -u)" > README.txt
          git init -q -b android-tv-build
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Android TV build ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" android-tv-build
