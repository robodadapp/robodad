<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoboDad</title>
<style>
:root{--bg:#E8EFF5;--card:#fff;--ink:#1B2A3A;--muted:#5A6B7E;--btn:#F2B533;--btn-ink:#2A1E00}
@media (prefers-color-scheme: dark){:root{--bg:#101821;--card:#1A2632;--ink:#E5EDF5;--muted:#9AAABB}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
main{background:var(--card);border-radius:24px;padding:28px 22px;max-width:340px}
.bot{font-size:56px;line-height:1;margin-bottom:8px}
h1{font-size:1.4rem;margin:0 0 8px} p{color:var(--muted);margin:0 0 20px}
a{display:inline-block;background:var(--btn);color:var(--btn-ink);font-weight:800;text-decoration:none;padding:12px 26px;border-radius:999px}
small{display:block;margin-top:14px;color:var(--muted)}
</style></head>
<body><main>
<div class="bot" aria-hidden="true">🤖📡</div>
<h1>Dad's lost the signal</h1>
<p>Like when the Wi-Fi drops right before the big game. Check your Wi-Fi or mobile data.</p>
<a href="https://robodad.app/?source=android">Try again</a>
<small>RoboDad will reconnect on his own once you're back online.</small>
</main>
<script>
window.addEventListener("online", function () { location.href = "https://robodad.app/?source=android"; });
</script>
</body></html>
