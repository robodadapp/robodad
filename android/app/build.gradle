plugins { id "com.android.application" }

// The release is signed only when the four ANDROID_* secrets are present
// (GitHub Actions passes them in). Without them the build is unsigned.
def ksFile = System.getenv("ANDROID_KEYSTORE_FILE")
def hasKey = ksFile && new File(ksFile).exists()

android {
    namespace "app.robodad"
    compileSdk 36

    defaultConfig {
        applicationId "app.robodad"
        minSdk 24
        targetSdk 36
        versionCode Integer.parseInt(System.getenv("ANDROID_VERSION_CODE") ?: "2")
        versionName System.getenv("ANDROID_VERSION_NAME") ?: "1.2.0"
    }

    signingConfigs {
        if (hasKey) {
            upload {
                storeFile file(ksFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: System.getenv("ANDROID_KEY_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasKey) signingConfig signingConfigs.upload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "com.google.android.play:review:2.0.2"

    // Explicit overrides: com.google.android.play:review:2.0.2 transitively pulls very old
    // androidx.fragment (1.1.0) and androidx.activity (1.0.0), which Play Console flags as
    // outdated. Gradle's default resolution strategy picks the highest requested version,
    // so declaring these directly forces the newer, non-flagged releases.
    implementation "androidx.fragment:fragment:1.8.5"
    implementation "androidx.activity:activity:1.9.3"

    // Those newer androidx libraries bring kotlin-stdlib 1.8, while older libraries still
    // pull kotlin-stdlib-jdk7/jdk8 1.6. From Kotlin 1.8 those classes live in kotlin-stdlib
    // itself, so both copies end up in the app and the build fails with "Duplicate class
    // kotlin.collections.jdk8...". The Kotlin BOM lines every kotlin-stdlib part up on one
    // version, where the jdk7/jdk8 parts are empty shells.
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
}
